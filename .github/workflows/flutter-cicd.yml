name: Flutter CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Validate KEYSTORE_BASE64
        run: |
          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty" >&2
            exit 1
          fi
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r' | base64 --decode > /dev/null

      - name: Validate signing secrets
        run: |
          if [[ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is empty" >&2
            exit 1
          fi
          if [[ -z "${{ secrets.KEY_ALIAS }}" ]]; then
            echo "ERROR: KEY_ALIAS secret is empty" >&2
            exit 1
          fi
          if [[ -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "ERROR: KEY_PASSWORD secret is empty" >&2
            exit 1
          fi

      - name: Decode Keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r' | base64 --decode > android/app/upload.jks

      - name: Verify keystore contains alias
        run: |
          keytool -list -keystore android/app/upload.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | sed -n '1,120p'
          keytool -list -keystore android/app/upload.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" > /dev/null

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../upload.jks" >> android/key.properties

      - name: Build AAB
        run: flutter build appbundle --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_ACCOUNT_KEY }}
          packageName: com.localbaskethd
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft